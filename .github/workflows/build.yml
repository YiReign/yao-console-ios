name: Build unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build for iPhone without code signing
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project ios/YaoConsole.xcodeproj \
            -scheme YaoConsole -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build 2>&1 | tail -40

      - name: Package and validate unsigned IPA
        run: |
          set -euo pipefail
          APP='ios/build/Build/Products/Release-iphoneos/YaoConsole.app'
          test -x "$APP/YaoConsole"
          file "$APP/YaoConsole"
          lipo "$APP/YaoConsole" -verify_arch arm64
          if codesign -v "$APP" 2>/dev/null; then echo 'Unexpected signed app'; exit 1; fi
          test ! -e "$APP/_CodeSignature"
          mkdir -p dist/package/Payload
          cp -R "$APP" dist/package/Payload/
          (cd dist/package && zip -qry ../yao-console-v1.2.ipa Payload)
          ls -lh dist/yao-console-v1.2.ipa
          shasum -a 256 dist/yao-console-v1.2.ipa | tee dist/yao-console-v1.2.ipa.sha256

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build${{ github.run_number }}
          name: YAO 控制台 v1.0 (build ${{ github.run_number }})
          body: |
            未签名 IPA，用于自行重签安装。
            包含：服务器面板、时钟控制台、YAO AI、个人站
          files: |
            dist/yao-console-v1.2.ipa
            dist/yao-console-v1.2.ipa.sha256
          draft: false
          prerelease: false
